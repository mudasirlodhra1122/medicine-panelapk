name: Build APK from HTML

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK manually
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          curl -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-33" "platforms;android-34" "build-tools;33.0.2" "build-tools;34.0.0"

      - name: Install compatible Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O gradle.zip
          unzip -q gradle.zip -d $HOME
          echo "$HOME/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova project
        run: |
          cordova create cordova-app com.medicinepanel.app "Medicine Panel"
          rm -rf cordova-app/www/*
          cp index.html cordova-app/www/

      - name: Add icon (if provided)
        run: |
          if [ -f "icon.png" ]; then
            sudo apt-get update -y && sudo apt-get install -y imagemagick
            cd cordova-app
            mkdir -p res/icon/android
            convert ../icon.png -resize 36x36 res/icon/android/ldpi.png
            convert ../icon.png -resize 48x48 res/icon/android/mdpi.png
            convert ../icon.png -resize 72x72 res/icon/android/hdpi.png
            convert ../icon.png -resize 96x96 res/icon/android/xhdpi.png
            convert ../icon.png -resize 144x144 res/icon/android/xxhdpi.png
            convert ../icon.png -resize 192x192 res/icon/android/xxxhdpi.png
            ICON_BLOCK='<platform name="android">\n<icon density="ldpi" src="res/icon/android/ldpi.png" />\n<icon density="mdpi" src="res/icon/android/mdpi.png" />\n<icon density="hdpi" src="res/icon/android/hdpi.png" />\n<icon density="xhdpi" src="res/icon/android/xhdpi.png" />\n<icon density="xxhdpi" src="res/icon/android/xxhdpi.png" />\n<icon density="xxxhdpi" src="res/icon/android/xxxhdpi.png" />\n</platform>'
            sed -i "s#</widget>#${ICON_BLOCK}\n</widget>#" config.xml
          fi

      - name: Add Android platform
        working-directory: cordova-app
        run: cordova platform add android@12.0.1

      - name: Build APK
        working-directory: cordova-app
        run: cordova build android

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MedicinePanel-APK
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/*.apk
